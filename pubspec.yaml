name: fishing_competition
description: "낚시 대회 관리 앱 - 웹/모바일 지원"
publish_to: 'none'

version: 1.0.0+53

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 상태관리
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 라우팅
  go_router: ^14.8.1

  # UI
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1  # cached_network_image 의존이지만 직접 import 사용

  # 네트워크
  dio: ^5.8.0+1

  # 유틸리티
  intl: ^0.20.2
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # 가시성 감지
  visibility_detector: ^0.4.0+2

  # 이미지/동영상 피커
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  video_compress: ^3.1.2
  video_player: ^2.9.2

  # YouTube 임베드 (피드 링크 게시물)
  youtube_player_flutter: ^9.1.1

  # 갤러리 저장
  gal: ^1.3.0

  # SVG
  flutter_svg: ^2.0.17

  # 지도/위치
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  supabase_flutter: ^2.12.4
  flutter_dotenv: ^6.0.1
  lucide_icons: ^0.257.0
  flutter_slidable: ^4.0.3

  # 인앱 업데이트
  package_info_plus: ^8.3.0
  open_file: ^3.3.2
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  android_intent_plus: ^6.0.0

  # 딥링크 (nakstar:// 및 https://nakstar.app)
  app_links: ^6.3.2

  # FCM 푸시 알림
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  app_badge_plus: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

  # 코드 생성
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.5
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#00FF88"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/

  # 커스텀 폰트 사용 시 assets/fonts/ 에 파일 추가 후 아래 주석 해제
  # fonts:
  #   - family: Pretendard
  #     fonts:
  #       - asset: assets/fonts/Pretendard-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Pretendard-Bold.ttf
  #         weight: 700
